services:
  db:
    image: postgres:16
    restart: always
    env_file:
      - ./docker/postgres.env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgresql-primary.conf:/etc/postgresql/postgresql.conf
      - ./docker/pg_hba.conf:/etc/postgresql/pg_hba.conf
      - ./docker/init-primary.sh:/docker-entrypoint-initdb.d/init-primary.sh
      - ./docker/healthcheck.sh:/usr/local/bin/healthcheck.sh
    ports:
      - '5432:5432'
    command: postgres -c config_file=/etc/postgresql/postgresql.conf -c hba_file=/etc/postgresql/pg_hba.conf
    healthcheck:
      test: [ "CMD", "/bin/bash", "/usr/local/bin/healthcheck.sh" ]
      interval: 10s
      timeout: 5s
      retries: 5

  db-replica-1:
    image: postgres:16
    restart: always
    user: postgres
    env_file:
      - ./docker/replica.env
    volumes:
      - pgdata_replica1:/var/lib/postgresql/data
      - ./docker/postgresql-replica.conf:/etc/postgresql/postgresql.conf
      - ./docker/start-replica.sh:/usr/local/bin/start-replica.sh
      - ./docker/healthcheck.sh:/usr/local/bin/healthcheck.sh
    ports:
      - '5433:5432'
    depends_on:
      db:
        condition: service_healthy
    command: [ "/bin/bash", "/usr/local/bin/start-replica.sh" ]
    healthcheck:
      test: [ "CMD", "/bin/bash", "/usr/local/bin/healthcheck.sh" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  db-replica-2:
    image: postgres:16
    restart: always
    user: postgres
    env_file:
      - ./docker/replica.env
    volumes:
      - pgdata_replica2:/var/lib/postgresql/data
      - ./docker/postgresql-replica.conf:/etc/postgresql/postgresql.conf
      - ./docker/start-replica.sh:/usr/local/bin/start-replica.sh
      - ./docker/healthcheck.sh:/usr/local/bin/healthcheck.sh
    ports:
      - '5434:5432'
    depends_on:
      db:
        condition: service_healthy
    command: [ "/bin/bash", "/usr/local/bin/start-replica.sh" ]
    healthcheck:
      test: [ "CMD", "/bin/bash", "/usr/local/bin/healthcheck.sh" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  api:
    build: .
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - .env
    depends_on:
      - db
      - redis
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/health" ]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 5s
    volumes:
      - .:/usr/src/app
    working_dir: /usr/src/app
    command: pnpm dev

  redis:
    image: redis:latest
    restart: always
    ports:
      - '6379:6379'
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - redis_data:/data

volumes:
  pgdata:
  pgdata_replica1:
  pgdata_replica2:
  redis_data:


