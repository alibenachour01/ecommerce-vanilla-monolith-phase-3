# TYPE  DATABASE        USER            ADDRESS                 METHOD

# "local" is for Unix domain socket connections only
local   all             all                                     trust
# IPv4 local connections:
host    all             all             127.0.0.1/32            trust
# IPv6 local connections:
host    all             all             ::1/128                 trust
# Allow replication connections from localhost, by a user with the
# replication privilege.
local   replication     all                                     trust
host    replication     all             127.0.0.1/32            trust
host    replication     all             ::1/128                 trust

# Allow connections from Docker network for application users
host    all             all             172.16.0.0/12           trust
host    all             all             10.0.0.0/8              trust
host    all             all             192.168.0.0/16          trust

# Allow replication connections from Docker network for replication user
host    replication     replicator      172.16.0.0/12           trust
host    replication     replicator      10.0.0.0/8              trust
host    replication     replicator      192.168.0.0/16          trust

# Allow connections from any host for application users (fallback)
host    all             all             0.0.0.0/0               md5

# Allow replication connections from any host for replication user (fallback)
host    replication     replicator      0.0.0.0/0               md5
